<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none"><defs><linearGradient id="bg" x1="72" y1="42" x2="1115" y2="590" gradientUnits="userSpaceOnUse"><stop stop-color="#07152f"/><stop offset="1" stop-color="#0f766e"/></linearGradient><linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16a34a" stop-opacity="0.95"/><stop offset="1" stop-color="#86efac" stop-opacity="0.8"/></linearGradient><linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dc2626" stop-opacity="0.95"/><stop offset="1" stop-color="#fdba74" stop-opacity="0.85"/></linearGradient></defs><rect width="1200" height="630" rx="28" fill="url(#bg)"/><circle cx="150" cy="90" r="52" fill="#fff" fill-opacity="0.06"/><circle cx="1048" cy="92" r="48" fill="#fff" fill-opacity="0.06"/><text x="600" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">هل الذكاء الاصطناعي سينقذ المواقع العربية؟</text><rect x="264" y="96" width="672" height="54" rx="18" fill="#f97316"/><text x="600" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">أم يدفنها تحت المحتوى السريع؟</text><rect x="94" y="186" width="1012" height="354" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/><rect x="122" y="228" width="330" height="266" rx="24" fill="url(#left)" fill-opacity="0.18"/><text x="420" y="272" text-anchor="end" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">الإنقاذ</text><text x="414" y="326" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#dcfce7">• إنتاج أسرع</text><text x="414" y="366" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#dcfce7">• تقليل التكلفة</text><text x="414" y="406" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#dcfce7">• سد فجوات المحتوى</text><text x="414" y="446" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#dcfce7">• فرص لصاحب الموقع الفردي</text><rect x="748" y="228" width="330" height="266" rx="24" fill="url(#right)" fill-opacity="0.18"/><text x="1046" y="272" text-anchor="end" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">الدفن</text><text x="1040" y="326" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff7ed">• محتوى سريع ومكرر</text><text x="1040" y="366" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff7ed">• فقدان الهوية</text><text x="1040" y="406" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff7ed">• إغراق السوق بالضوضاء</text><text x="1040" y="446" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff7ed">• ضعف الثقة</text><circle cx="600" cy="360" r="94" fill="#ffffff" fill-opacity="0.11" stroke="#ffffff" stroke-opacity="0.22"/><path d="M560 404C560 369.758 587.758 342 622 342H640C674.242 342 702 369.758 702 404V430H560V404Z" fill="#ffffff" fill-opacity="0.14"/><circle cx="630" cy="320" r="44" fill="#ffffff" fill-opacity="0.14"/><circle cx="614" cy="314" r="6" fill="#ffffff"/><circle cx="646" cy="314" r="6" fill="#ffffff"/><path d="M612 334C621 342 639 342 648 334" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><path d="M585 290L630 260L675 290V340C675 364.853 654.853 385 630 385C605.147 385 585 364.853 585 340V290Z" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/><rect x="172" y="554" width="856" height="34" rx="12" fill="#02111f" fill-opacity="0.66"/><text x="600" y="577" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">الذكاء الاصطناعي قد ينقذ المواقع العربية إذا خدم الجودة، وقد يدفنها إذا خدم السرعة فقط</text></svg>